services:
  daily:
    build: .
    restart: unless-stopped
    ports:
      - "80:4173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4173"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
